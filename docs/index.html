<!DOCTYPE html>
<html>
<head>
    <title>DevOps Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            padding: 80px 20px;
        }

        .card {
            max-width: 850px;
            margin: auto;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 35px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .feature {
            background: white;
            color: #333;
            padding: 20px;
            width: 200px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            margin-top: 40px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🚀 Welcome to My DevOps Project</h1>

        <p class="subtitle">
            Automated, Tested & Deployed using Gradle
        </p>

        <div class="features">

            <div class="feature">
                ⚙️ Gradle
            </div>

            <div class="feature">
                🧪 Selenium
            </div>

            <div class="feature">
                ✅ TestNG
            </div>

            <div class="feature">
                🌐 GitHub Pages
            </div>

        </div>

        <p class="footer">
            Built with HTML, CSS & Gradle 💜
        </p>

    </div>

</div>

</body>
</html>
